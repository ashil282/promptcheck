[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcheck"
version = "0.1.0"
description = "Run test cases against LLM prompts and catch regressions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
promptcheck = "promptcheck.cli:main"

[tool.setuptools]
packages = ["promptcheck"]
